var app=document.getElementById("app"),Q,i,score,wrong,cur;
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function flat(n){var r=[];S[n][1].forEach(function(g){for(var k=1;k<g.length;k++)r.push({t:g[0],q:g[k][0],a:g[k][1],o:g[k].slice(1)})});return r}
function menu(){
 var h='';S.forEach(function(s,n){h+='<button class="o m" data-n="'+n+'"><b>'+s[0]+'</b><small>'+flat(n).length+' ข้อ</small></button>'});
 h+='<button class="o m" data-n="-1"><b>ทั้งหมดสุ่มรวม</b><small>94 ข้อ</small></button>';
 app.innerHTML=h;
 app.querySelectorAll(".m").forEach(function(b){b.onclick=function(){begin(+b.dataset.n)}});
}
function begin(n){cur=n;var l=n<0?[].concat(flat(0),flat(1),flat(2)):flat(n);run(sh(l))}
function run(l){Q=l.map(function(d){return{t:d.t,q:d.q,a:d.a,o:sh(d.o)}});i=0;score=0;wrong=[];show()}
function show(){
 if(i>=Q.length)return end();
 var d=Q[i];
 var h='<div class="top"><span>ข้อ '+(i+1)+' / '+Q.length+'</span><span id="sc">คะแนน '+score+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><span class="tag">'+esc(d.t)+'</span><p class="q">'+esc(d.q)+'</p>';
 d.o.forEach(function(o,k){h+='<button class="o" data-k="'+k+'">'+esc(o)+'</button>'});
 h+='<button class="b hid" id="nx">'+(i==Q.length-1?'ดูผลคะแนน':'ข้อถัดไป')+'</button></div>';
 app.innerHTML=h;
 var bs=app.querySelectorAll(".o");
 bs.forEach(function(b){b.onclick=function(){
  var v=d.o[+b.dataset.k];
  bs.forEach(function(x){x.disabled=true;if(d.o[+x.dataset.k]===d.a)x.classList.add("ok")});
  if(v===d.a)score++;else{b.classList.add("no");wrong.push(d)}
  document.getElementById("nx").classList.remove("hid");
  document.getElementById("sc").textContent="คะแนน "+score;
 }});
 document.getElementById("nx").onclick=function(){i++;show();window.scrollTo(0,0)};
}
function end(){
 var p=Math.round(score/Q.length*100),m=p>=80?"เก่งมาก! 🎉":p>=50?"ผ่านครึ่งทางแล้ว สู้ต่อ 💪":"ลองทบทวนแล้วทำใหม่นะ 📖";
 var h='<div class="card"><div class="c">คะแนนของคุณ</div><div class="big">'+score+' / '+Q.length+'</div><div class="c">'+p+'% · '+m+'</div>';
 if(wrong.length){h+='<h3>ข้อที่ตอบผิด ('+wrong.length+')</h3>';wrong.forEach(function(d){h+='<div class="r"><b>'+esc(d.t)+': '+esc(d.q)+'</b><span>✔ '+esc(d.a)+'</span></div>'})}
 h+='<button class="b" id="re">ทำชุดนี้ใหม่</button>';
 if(wrong.length)h+='<button class="b g" id="rw" style="margin-top:0">ทำซ้ำเฉพาะข้อที่ผิด</button>';
 h+='<button class="b g" id="mn" style="margin-top:0">กลับไปเลือกชุด</button></div>';
 app.innerHTML=h;
 document.getElementById("re").onclick=function(){begin(cur)};
 document.getElementById("mn").onclick=menu;
 var rw=document.getElementById("rw");
 if(rw)rw.onclick=function(){run(sh(wrong))};
 window.scrollTo(0,0);
}
menu();
</script>
